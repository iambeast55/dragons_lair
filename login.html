<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to Dragon's Lair private photo archive.">
  <title>Sign in | Dragon's Lair</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <img class="login-backdrop" src="windows/screenshots/2026-08-22_063000-build.png" alt="" aria-hidden="true">
  <div class="login-shade" aria-hidden="true"></div>
  <header class="login-header">
    <a class="brand brand-light" href="/login.html" aria-label="Dragon's Lair sign in">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span><strong>Dragon's Lair</strong><small>Private archive</small></span>
    </a>
    <span class="privacy-label"><span class="status-dot"></span> Protected access</span>
  </header>
  <main class="login-content">
    <p class="eyebrow">Private photo archive</p>
    <h1>Your windows,<br>kept in order.</h1>
    <p class="login-copy">A quiet place to review captures by folder and timestamp. Sign in with your authorized Microsoft account to continue.</p>
    <a class="login-button" href="/.auth/login/aad">
      <span class="microsoft-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      Continue with Microsoft
    </a>
    <p class="login-note" id="loginStatus">Access is managed by Azure Static Web Apps.</p>
  </main>
  <script src="login.js" defer></script>
</body>
</html>
