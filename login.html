<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to Dragon's Lair private photo archive.">
  <title>Sign in | Dragon's Lair</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <img class="login-backdrop" src="assets/cyber-login.png" alt="" aria-hidden="true">
  <div class="login-shade" aria-hidden="true"></div>
  <main class="login-content">
    <form class="login-form" id="loginForm">
      <div class="login-mark" aria-hidden="true">DL</div>
      <h1>Sign in</h1>
      <label>Username<input id="username" name="username" autocomplete="username" required autofocus></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p class="login-status" id="loginStatus" role="alert" aria-live="polite"></p>
      <button class="login-button" id="loginButton" type="submit">Enter archive</button>
    </form>
  </main>
  <script src="login.js" defer></script>
</body>
</html>
