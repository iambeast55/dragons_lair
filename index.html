<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragon's Lair</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070a10;
      color: #eaf2ff;
      --panel: rgba(13, 18, 30, 0.82);
      --panel-strong: rgba(18, 25, 40, 0.94);
      --line: rgba(127, 219, 255, 0.22);
      --line-hot: rgba(255, 74, 143, 0.42);
      --text-soft: #91a3b8;
      --cyan: #7fdbff;
      --pink: #ff4a8f;
      --green: #7cffb2;
      --amber: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(120deg, rgba(127, 219, 255, 0.11), transparent 34%),
        linear-gradient(300deg, rgba(255, 74, 143, 0.12), transparent 38%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 34px),
        #070a10;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .shell {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 12px;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(18, 25, 40, 0.96), rgba(7, 10, 16, 0.92)),
        var(--panel-strong);
    }

    .brand {
      display: grid;
      gap: 8px;
      padding: 0 6px 22px;
    }

    h1 {
      margin: 0;
      color: #ffffff;
      font-size: 1.4rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .meta {
      margin: 0;
      color: var(--text-soft);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 6px 10px;
    }

    .rail-label {
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .folder-list {
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 196px);
      overflow: auto;
      padding: 2px 4px 2px 0;
    }

    .folder-item {
      width: 100%;
      min-height: 44px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 9px 8px;
      border: 1px solid rgba(127, 219, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.035);
      color: #dce9f8;
      text-align: left;
    }

    .folder-item:hover,
    .folder-item:focus-visible {
      border-color: rgba(127, 219, 255, 0.48);
      background: rgba(127, 219, 255, 0.08);
      outline: none;
    }

    .folder-item.active {
      border-color: rgba(255, 74, 143, 0.7);
      background: linear-gradient(90deg, rgba(255, 74, 143, 0.17), rgba(127, 219, 255, 0.09));
      box-shadow: 0 0 0 1px rgba(255, 74, 143, 0.12), 0 0 24px rgba(255, 74, 143, 0.08);
    }

    .folder-icon {
      position: relative;
      width: 23px;
      height: 17px;
      border: 1px solid rgba(127, 219, 255, 0.76);
      border-radius: 3px;
      background: rgba(127, 219, 255, 0.12);
      box-shadow: 0 0 12px rgba(127, 219, 255, 0.18);
    }

    .folder-icon::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 1px;
      width: 10px;
      height: 6px;
      border: 1px solid rgba(127, 219, 255, 0.76);
      border-bottom: 0;
      border-radius: 3px 3px 0 0;
      background: rgba(127, 219, 255, 0.12);
    }

    .folder-name,
    .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-count {
      color: var(--text-soft);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .content {
      min-width: 0;
      padding: 30px clamp(18px, 3vw, 48px) 48px;
    }

    .toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.6rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .summary {
      margin: 10px 0 0;
      color: var(--text-soft);
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex: 0 0 auto;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(127, 219, 255, 0.28);
      border-radius: 8px;
      background: rgba(13, 18, 30, 0.88);
      color: #eaf2ff;
      font-size: 1.15rem;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: var(--cyan);
      color: #ffffff;
      outline: none;
    }

    .endpoint {
      margin: 16px 0 20px;
      color: var(--green);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .tile {
      position: relative;
      height: 260px;
      overflow: hidden;
      border: 1px solid rgba(127, 219, 255, 0.16);
      border-radius: 8px;
      background: #0d121e;
      color: inherit;
      padding: 0;
      text-align: left;
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid transparent;
      border-radius: inherit;
      pointer-events: none;
    }

    .tile:hover::after,
    .tile:focus-visible::after {
      border-color: rgba(255, 74, 143, 0.62);
      box-shadow: inset 0 0 0 1px rgba(127, 219, 255, 0.16);
    }

    .tile img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .tile:hover img,
    .tile:focus-visible img {
      transform: scale(1.035);
      filter: saturate(1.08);
    }

    .caption {
      position: absolute;
      inset: auto 0 0;
      display: grid;
      gap: 3px;
      padding: 48px 12px 12px;
      background: linear-gradient(transparent, rgba(4, 7, 12, 0.88));
      color: #fff;
    }

    .name {
      font-weight: 850;
    }

    .time {
      color: rgba(234, 242, 255, 0.72);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.78rem;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 360px;
      border: 1px dashed rgba(127, 219, 255, 0.28);
      border-radius: 8px;
      color: var(--text-soft);
      text-align: center;
      padding: 32px;
      background: rgba(13, 18, 30, 0.54);
    }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      grid-template-rows: auto 1fr auto;
      background: rgba(4, 7, 12, 0.96);
      color: #fff;
    }

    .viewer.open {
      display: grid;
    }

    .viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(127, 219, 255, 0.14);
    }

    .viewer-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }

    .viewer-stage {
      min-height: 0;
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
    }

    .viewer-image {
      max-width: 100%;
      max-height: calc(100vh - 148px);
      justify-self: center;
      object-fit: contain;
    }

    .viewer-foot {
      padding: 0 16px 14px;
      color: rgba(234, 242, 255, 0.72);
      text-align: center;
    }

    @media (max-width: 820px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        padding: 20px 16px 12px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        padding-bottom: 16px;
      }

      .folder-list {
        grid-auto-flow: column;
        grid-auto-columns: minmax(160px, 1fr);
        overflow-x: auto;
        overflow-y: hidden;
        max-height: none;
        padding-bottom: 8px;
      }

      .content {
        padding-top: 22px;
      }

      .toolbar {
        display: grid;
      }

      .actions {
        justify-content: flex-start;
      }

      .tile {
        height: 220px;
      }

      .viewer-stage {
        grid-template-columns: 44px 1fr 44px;
        padding: 0 8px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Folders">
      <div class="brand">
        <h1>Dragon's Lair</h1>
        <p class="meta">Window archive</p>
      </div>

      <div class="rail-head">
        <span class="rail-label">Folders</span>
        <button class="icon-button" id="refreshButton" type="button" title="Refresh folders and photos" aria-label="Refresh folders and photos">R</button>
      </div>

      <nav class="folder-list" id="folderList" aria-label="Photo folders"></nav>
    </aside>

    <main class="content">
      <section class="toolbar">
        <div>
          <p class="kicker">Repository feed</p>
          <h2 class="title" id="folderTitle">Loading</h2>
          <p class="summary" id="countText" aria-live="polite">Loading folders...</p>
        </div>
        <div class="actions">
          <button class="icon-button" id="sortButton" type="button" title="Reverse timestamp sort" aria-label="Reverse timestamp sort">S</button>
        </div>
      </section>

      <div class="endpoint" id="endpointText"></div>
      <section id="gallery" class="gallery" aria-label="Photos"></section>
    </main>
  </div>

  <aside class="viewer" id="viewer" aria-modal="true" role="dialog" aria-label="Photo viewer">
    <div class="viewer-bar">
      <div class="viewer-title" id="viewerTitle"></div>
      <button class="icon-button" id="closeButton" type="button" title="Close" aria-label="Close">X</button>
    </div>
    <div class="viewer-stage">
      <button class="icon-button" id="prevButton" type="button" title="Previous photo" aria-label="Previous photo">&lt;</button>
      <img class="viewer-image" id="viewerImage" alt="">
      <button class="icon-button" id="nextButton" type="button" title="Next photo" aria-label="Next photo">&gt;</button>
    </div>
    <div class="viewer-foot" id="viewerMeta"></div>
  </aside>

  <script>
    const owner = "iambeast55";
    const repo = "dragons_lair";
    const branch = "master";
    const rootFolder = "windows";
    const imagePattern = /\.(avif|gif|heic|jpeg|jpg|png|webp)$/i;

    const folderList = document.querySelector("#folderList");
    const sortButton = document.querySelector("#sortButton");
    const refreshButton = document.querySelector("#refreshButton");
    const countText = document.querySelector("#countText");
    const endpointText = document.querySelector("#endpointText");
    const folderTitle = document.querySelector("#folderTitle");
    const gallery = document.querySelector("#gallery");
    const viewer = document.querySelector("#viewer");
    const viewerImage = document.querySelector("#viewerImage");
    const viewerTitle = document.querySelector("#viewerTitle");
    const viewerMeta = document.querySelector("#viewerMeta");

    let repoTree = [];
    let folders = [];
    let photos = [];
    let activeFolder = new URLSearchParams(location.search).get("folder") || "";
    let sortNewestFirst = true;
    let activeIndex = 0;

    function api(path) {
      return `https://api.github.com/repos/${owner}/${repo}/${path}`;
    }

    function raw(path) {
      return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${encodeURIComponent(path).replaceAll("%2F", "/")}`;
    }

    function folderFromPath(path) {
      const withoutRoot = path.slice(rootFolder.length + 1);
      return withoutRoot.split("/")[0] || "";
    }

    function displayFolder(folder) {
      return folder.replaceAll("-", " ").replaceAll("_", " ");
    }

    function countImages(folder) {
      const prefix = `${rootFolder}/${folder}/`;
      return repoTree.filter((item) => item.type === "blob" && item.path.startsWith(prefix) && imagePattern.test(item.path)).length;
    }

    function formatDate(timestamp) {
      if (!timestamp) return "No timestamp found";
      return new Intl.DateTimeFormat(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }).format(new Date(timestamp));
    }

    function parseDateFromName(name) {
      const compact = name.match(/(20\d{2}|19\d{2})([01]\d)([0-3]\d)[-_ ]?([0-2]\d)?([0-5]\d)?([0-5]\d)?/);
      if (compact) {
        const [, year, month, day, hour = "00", minute = "00", second = "00"] = compact;
        const date = new Date(`${year}-${month}-${day}T${hour}:${minute}:${second}`);
        return Number.isNaN(date.getTime()) ? null : date.getTime();
      }

      const separated = name.match(/(20\d{2}|19\d{2})[-_. ]([01]?\d)[-_. ]([0-3]?\d)/);
      if (separated) {
        const [, year, month, day] = separated;
        const date = new Date(Number(year), Number(month) - 1, Number(day));
        return Number.isNaN(date.getTime()) ? null : date.getTime();
      }

      return null;
    }

    function readAscii(view, offset, length) {
      let value = "";
      for (let index = 0; index < length; index += 1) {
        value += String.fromCharCode(view.getUint8(offset + index));
      }
      return value;
    }

    function parseExifDate(buffer) {
      const view = new DataView(buffer);
      if (view.byteLength < 4 || view.getUint16(0) !== 0xffd8) return null;

      let offset = 2;
      while (offset + 4 < view.byteLength) {
        const marker = view.getUint16(offset);
        const size = view.getUint16(offset + 2);
        if (marker === 0xffe1 && readAscii(view, offset + 4, 6) === "Exif\0\0") {
          return parseTiffDate(view, offset + 10);
        }
        offset += 2 + size;
      }
      return null;
    }

    function parseTiffDate(view, start) {
      const endian = readAscii(view, start, 2);
      const little = endian === "II";
      if (!little && endian !== "MM") return null;

      const get16 = (offset) => view.getUint16(offset, little);
      const get32 = (offset) => view.getUint32(offset, little);
      const firstIfd = start + get32(start + 4);
      const exifIfd = findTagOffset(view, firstIfd, 0x8769, get16, get32, start);
      const dateOffset =
        findTagOffset(view, firstIfd, 0x0132, get16, get32, start) ||
        (exifIfd ? findTagOffset(view, exifIfd, 0x9003, get16, get32, start) : null) ||
        (exifIfd ? findTagOffset(view, exifIfd, 0x9004, get16, get32, start) : null);

      if (!dateOffset) return null;
      const value = readAscii(view, dateOffset, 19);
      const match = value.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
      if (!match) return null;
      const [, year, month, day, hour, minute, second] = match;
      const date = new Date(`${year}-${month}-${day}T${hour}:${minute}:${second}`);
      return Number.isNaN(date.getTime()) ? null : date.getTime();
    }

    function findTagOffset(view, ifdOffset, wantedTag, get16, get32, tiffStart) {
      if (ifdOffset + 2 >= view.byteLength) return null;
      const entryCount = get16(ifdOffset);
      for (let index = 0; index < entryCount; index += 1) {
        const entry = ifdOffset + 2 + index * 12;
        if (entry + 12 > view.byteLength) return null;
        const tag = get16(entry);
        if (tag !== wantedTag) continue;

        const type = get16(entry + 2);
        const count = get32(entry + 4);
        const value = get32(entry + 8);
        const byteCount = count * (type === 3 ? 2 : 1);
        return byteCount <= 4 ? entry + 8 : tiffStart + value;
      }
      return null;
    }

    async function fetchJson(url) {
      const response = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    async function loadTree() {
      countText.textContent = "Loading folders...";
      folderTitle.textContent = "Loading";
      gallery.innerHTML = "";
      const data = await fetchJson(api(`git/trees/${branch}?recursive=1`));
      repoTree = data.tree || [];
      folders = [...new Set(
        repoTree
          .filter((item) => item.type === "tree" && item.path.startsWith(`${rootFolder}/`))
          .map((item) => folderFromPath(item.path))
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b));

      renderFolders();
      await selectFolder(folders.includes(activeFolder) ? activeFolder : folders[0] || "");
    }

    function renderFolders() {
      folderList.innerHTML = "";
      if (!folders.length) {
        folderList.innerHTML = '<div class="empty">No folders yet</div>';
        return;
      }

      for (const folder of folders) {
        const button = document.createElement("button");
        button.className = `folder-item${folder === activeFolder ? " active" : ""}`;
        button.type = "button";
        button.setAttribute("aria-current", folder === activeFolder ? "page" : "false");
        button.addEventListener("click", () => selectFolder(folder));

        const icon = document.createElement("span");
        icon.className = "folder-icon";
        icon.setAttribute("aria-hidden", "true");

        const name = document.createElement("span");
        name.className = "folder-name";
        name.textContent = displayFolder(folder);

        const count = document.createElement("span");
        count.className = "folder-count";
        count.textContent = countImages(folder);

        button.append(icon, name, count);
        folderList.append(button);
      }
    }

    async function selectFolder(folder) {
      activeFolder = folder;
      renderFolders();
      const url = new URL(location.href);
      if (folder) url.searchParams.set("folder", folder);
      else url.searchParams.delete("folder");
      history.replaceState(null, "", url);
      endpointText.textContent = folder ? `?folder=${encodeURIComponent(folder)}` : "";

      if (!folder) {
        photos = [];
        folderTitle.textContent = "No folder";
        countText.textContent = "Add folders under windows to start browsing.";
        renderEmpty("Create a folder like windows/screenshots and add images inside it.");
        return;
      }

      folderTitle.textContent = displayFolder(folder);
      countText.textContent = `Loading ${displayFolder(folder)}...`;
      const prefix = `${rootFolder}/${folder}/`;
      photos = repoTree
        .filter((item) => item.type === "blob" && item.path.startsWith(prefix) && imagePattern.test(item.path))
        .map((item) => {
          const timestamp = parseDateFromName(item.path);
          return {
            path: item.path,
            name: item.path.split("/").pop(),
            url: raw(item.path),
            timestamp,
            timestampSource: timestamp ? "filename" : ""
          };
        });

      await hydrateTimestamps(photos);
      sortPhotos();
      renderGallery();
    }

    async function hydrateTimestamps(items) {
      await Promise.all(items.map(async (photo) => {
        if (!/\.(jpe?g)$/i.test(photo.name)) return;
        try {
          const response = await fetch(photo.url);
          const buffer = await response.arrayBuffer();
          const exifDate = parseExifDate(buffer);
          if (exifDate) {
            photo.timestamp = exifDate;
            photo.timestampSource = "EXIF";
          }
        } catch {
          // Filename dates remain useful when image metadata cannot be read.
        }
      }));
    }

    function sortPhotos() {
      photos.sort((a, b) => {
        const first = a.timestamp || 0;
        const second = b.timestamp || 0;
        return sortNewestFirst ? second - first || a.name.localeCompare(b.name) : first - second || a.name.localeCompare(b.name);
      });
    }

    function renderGallery() {
      gallery.innerHTML = "";
      if (!photos.length) {
        countText.textContent = `No images found in ${displayFolder(activeFolder)}.`;
        renderEmpty("Supported files: .jpg, .jpeg, .png, .webp, .gif, .avif, .heic");
        return;
      }

      countText.textContent = `${photos.length} photo${photos.length === 1 ? "" : "s"} sorted ${sortNewestFirst ? "newest first" : "oldest first"}.`;
      for (const [index, photo] of photos.entries()) {
        const tile = document.createElement("button");
        tile.className = "tile";
        tile.type = "button";
        tile.addEventListener("click", () => openViewer(index));

        const image = document.createElement("img");
        image.src = photo.url;
        image.alt = photo.name;
        image.loading = "lazy";

        const caption = document.createElement("span");
        caption.className = "caption";
        caption.innerHTML = '<span class="name"></span><span class="time"></span>';
        caption.querySelector(".name").textContent = photo.name;
        caption.querySelector(".time").textContent = `${formatDate(photo.timestamp)}${photo.timestampSource ? ` / ${photo.timestampSource}` : ""}`;

        tile.append(image, caption);
        gallery.append(tile);
      }
    }

    function renderEmpty(message) {
      gallery.innerHTML = `<div class="empty"><p>${message}</p></div>`;
    }

    function openViewer(index) {
      activeIndex = index;
      updateViewer();
      viewer.classList.add("open");
    }

    function updateViewer() {
      const photo = photos[activeIndex];
      if (!photo) return;
      viewerImage.src = photo.url;
      viewerImage.alt = photo.name;
      viewerTitle.textContent = photo.name;
      viewerMeta.textContent = `${activeIndex + 1} of ${photos.length} / ${formatDate(photo.timestamp)}${photo.timestampSource ? ` / ${photo.timestampSource}` : ""}`;
    }

    function moveViewer(direction) {
      if (!photos.length) return;
      activeIndex = (activeIndex + direction + photos.length) % photos.length;
      updateViewer();
    }

    sortButton.addEventListener("click", () => {
      sortNewestFirst = !sortNewestFirst;
      sortPhotos();
      renderGallery();
    });
    refreshButton.addEventListener("click", loadTree);
    document.querySelector("#closeButton").addEventListener("click", () => viewer.classList.remove("open"));
    document.querySelector("#prevButton").addEventListener("click", () => moveViewer(-1));
    document.querySelector("#nextButton").addEventListener("click", () => moveViewer(1));
    document.addEventListener("keydown", (event) => {
      if (!viewer.classList.contains("open")) return;
      if (event.key === "Escape") viewer.classList.remove("open");
      if (event.key === "ArrowLeft") moveViewer(-1);
      if (event.key === "ArrowRight") moveViewer(1);
    });

    loadTree().catch((error) => {
      folderTitle.textContent = "Offline";
      countText.textContent = "Could not load repository folders.";
      renderEmpty(error.message);
    });
  </script>
</body>
</html>
