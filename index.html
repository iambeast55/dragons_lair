<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A private, timestamped screenshot archive.">
  <title>Dragon's Lair | Archive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-page">
  <div class="app-shell">
    <aside class="sidebar" aria-label="Archive navigation">
      <a class="brand" href="/" aria-label="Dragon's Lair home">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span><strong>Dragon's Lair</strong><small>Screenshot archive</small></span>
      </a>
      <div class="archive-stats">
        <span><strong id="hostCount">0</strong> hosts</span>
        <span><strong id="photoCount">0</strong> screenshots</span>
      </div>
      <label class="folder-search">
        <span class="sr-only">Filter teams or IP addresses</span>
        <input id="folderSearch" type="search" placeholder="Filter teams or IPs…" autocomplete="off">
      </label>
      <div class="side-heading">
        <span>Teams</span>
        <button class="icon-button" id="refreshButton" type="button" title="Refresh archive" aria-label="Refresh archive">&#8635;</button>
      </div>
      <nav class="folder-list" id="folderList" aria-label="Photo folders"></nav>
      <div class="sidebar-footer">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="sourceStatus">Archive connected</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="page-heading">
          <p class="eyebrow" id="teamLabel">Blob archive</p>
          <h1 id="folderTitle">Loading</h1>
          <p id="countText" class="summary" aria-live="polite">Loading your archive...</p>
        </div>
        <div class="topbar-actions">
          <button class="sort-button" id="sortButton" type="button" aria-label="Change timestamp sorting">
            <span class="sort-icon" id="sortIcon" aria-hidden="true">&#8595;</span>
            <span id="sortLabel">Newest first</span>
          </button>
          <div class="account">
            <span class="avatar" id="userInitial" aria-hidden="true">U</span>
            <span class="account-copy">
              <strong id="userName">Archive session</strong>
              <span class="protected-label">Password protected</span>
            </span>
            <button class="logout-button" id="logoutButton" type="button">Sign out</button>
          </div>
        </div>
      </header>
      <section class="gallery" id="gallery" aria-label="Photos"></section>
      <nav class="pagination" id="pagination" aria-label="Screenshot pages" hidden>
        <button id="previousPage" type="button">Previous</button>
        <strong id="pageStatus">Page 1 of 1</strong>
        <button id="nextPage" type="button">Next</button>
      </nav>
    </main>
  </div>

  <dialog class="viewer" id="viewer" aria-labelledby="viewerTitle">
    <header class="viewer-header">
      <div><h2 id="viewerTitle"></h2><p id="viewerMeta"></p></div>
      <button class="viewer-close" id="closeButton" type="button" title="Close viewer" aria-label="Close viewer">&times;</button>
    </header>
    <div class="viewer-stage">
      <button class="viewer-nav previous" id="prevButton" type="button" title="Previous photo" aria-label="Previous photo">&lsaquo;</button>
      <img id="viewerImage" alt="">
      <button class="viewer-nav next" id="nextButton" type="button" title="Next photo" aria-label="Next photo">&rsaquo;</button>
    </div>
  </dialog>
  <script src="team-map.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
